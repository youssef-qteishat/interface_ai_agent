[project]
name = "interface-ai-take-home"
version = "0.1.0"
description = ""
authors = [
    {name = "Youssef Qteishat",email = "youssef.qt1@gmail.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.115.0)",
    "jinja2 (>=3.1.0)",
    "python-multipart (>=0.0.9)",
    "uvicorn (>=0.30.0)",
    "anthropic (>=1.7.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "typer (>=0.27.2,<0.28.0)"
]


[tool.poetry]
# This repo is an application, not a distributable package: `apps/`, `src/` and
# `sandbox/` are plain directories with no importable root module. Poetry manages
# dependencies only. (The Step 1 Dockerfile expresses the same fact as --no-root.)
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
# The surface adapter and the pause barrier are async (the barrier has to interrupt a
# run between actions), so their tests need an event loop.
pytest-asyncio = ">=0.24"

[tool.pytest.ini_options]
# The project is not installed as a package (the sim and the orchestrator are just
# directories), so put the repo root on sys.path for `import src.domain...`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
